services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      - KAPOWARR_URL=${KAPOWARR_URL:-http://host.docker.internal:5656}
      - KAPOWARR_API_KEY=${KAPOWARR_API_KEY:-}
      - KAPOWARR_ROOT_FOLDER_ID=${KAPOWARR_ROOT_FOLDER_ID:-1}
      - KOMGA_URL=${KOMGA_URL:-http://host.docker.internal:25600}
      - KOMGA_API_KEY=${KOMGA_API_KEY:-}
      - DATA_DIR=/data
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
